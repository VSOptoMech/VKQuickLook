[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vkquicklook"
version = "0.2.0"
description = "Native desktop thumbnails and previews for Keyence VK4/VK6 measurement files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
vk-thumbnailer = "vkquicklook_linux.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
